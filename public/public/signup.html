<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefly - Créer un compte Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="loader" class="text-white font-black animate-pulse">VÉRIFICATION DE L'INVITATION...</div>

    <div id="signup-card" class="hidden bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl w-full max-w-md border-t-8 border-indigo-600">
        <h1 class="text-3xl font-black mb-2 uppercase tracking-tighter italic text-slate-900">Bienvenue<span class="text-indigo-600">.</span></h1>
        <p id="role-badge" class="inline-block px-3 py-1 bg-indigo-100 text-indigo-600 text-[10px] font-black rounded-full uppercase mb-8"></p>
        
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Nom Complet</label>
                <input type="text" id="name" placeholder="Josué KPLOW..." class="w-full px-6 py-4 bg-slate-100 rounded-2xl outline-none text-sm font-semibold focus:ring-2 ring-indigo-500 transition-all">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Email Professionnel</label>
                <input type="email" id="email" placeholder="email@exemple.com" class="w-full px-6 py-4 bg-slate-100 rounded-2xl outline-none text-sm font-semibold focus:ring-2 ring-indigo-500 transition-all">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-slate-400 ml-2">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full px-6 py-4 bg-slate-100 rounded-2xl outline-none text-sm font-semibold focus:ring-2 ring-indigo-500 transition-all">
            </div>
            <button id="btn-register" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-xs shadow-lg shadow-indigo-200 active:scale-95 transition-all mt-4">Créer mon accès admin</button>
        </div>
        <p id="error-msg" class="text-red-500 text-[10px] font-bold uppercase mt-4 text-center hidden"></p>
    </div>

    <div id="invalid-card" class="hidden text-center bg-white p-10 rounded-[3rem] max-w-sm">
        <span class="text-5xl">🚫</span>
        <h2 class="text-xl font-black text-slate-900 mt-4 uppercase">Lien Invalide</h2>
        <p class="text-slate-500 text-sm mt-2">Cette invitation a déjà été utilisée ou n'existe plus. Contactez Josué.</p>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDOPeLjRRM88dE665rKZigk2JmA-J9YXek",
        authDomain: "bbriefly-7e3b8.firebaseapp.com",
        projectId: "bbriefly-7e3b8",
        storageBucket: "bbriefly-7e3b8.firebasestorage.app",
        messagingSenderId: "634935431290",
        appId: "1:634935431290:web:1dcb513aafc3011133ebc3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 1. Récupérer le token dans l'URL (?invite=XYZ)
    const urlParams = new URLSearchParams(window.location.search);
    const inviteToken = urlParams.get('invite');
    let inviteData = null;

    async function checkInvite() {
        if (!inviteToken) {
            showInvalid();
            return;
        }

        const inviteRef = doc(db, "invitations", inviteToken);
        const snap = await getDoc(inviteRef);

        if (snap.exists() && snap.data().used === false) {
            inviteData = snap.data();
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('signup-card').classList.remove('hidden');
            document.getElementById('role-badge').innerText = "Rôle : " + inviteData.role.replace('_', ' ');
        } else {
            showInvalid();
        }
    }

    function showInvalid() {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('invalid-card').classList.remove('hidden');
    }

    // 2. Action d'inscription
    document.getElementById('btn-register').onclick = async () => {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errMsg = document.getElementById('error-msg');

        if (!name || !email || password.length < 6) {
            errMsg.innerText = "Complétez tous les champs (6 caractères min pour le pass)";
            errMsg.classList.remove('hidden');
            return;
        }

        try {
            // A. Créer le compte Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // B. Créer le profil Admin dans Firestore
            await setDoc(doc(db, "admins", user.uid), {
                name: name,
                email: email,
                role: inviteData.role,
                createdAt: serverTimestamp()
            });

            // C. Désactiver l'invitation pour qu'elle ne soit plus réutilisable
            await updateDoc(doc(db, "invitations", inviteToken), {
                used: true,
                usedBy: user.uid,
                usedAt: serverTimestamp()
            });

            alert("Compte créé avec succès !");
            window.location.href = "index.html"; // Rediriger vers ton dashboard

        } catch (e) {
            errMsg.innerText = "Erreur : " + e.message;
            errMsg.classList.remove('hidden');
        }
    };

    checkInvite();
</script>
</body>
</html>
