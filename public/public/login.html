<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Staff - Briefly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-6">

    <div class="login-card w-full max-w-md p-10 rounded-[3rem] shadow-2xl text-white">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">Briefly<span class="text-blue-500">.</span></h1>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mt-2">Espace Staff</p>
        </div>

        <div class="space-y-4">
            <div class="group">
                <label class="text-[10px] font-black uppercase text-slate-500 ml-2 mb-1 block">Identifiant</label>
                <input type="email" id="email" class="w-full p-4 bg-slate-800/50 rounded-2xl border border-transparent focus:border-blue-500 outline-none transition-all font-bold text-sm">
            </div>
            <div class="group">
                <label class="text-[10px] font-black uppercase text-slate-500 ml-2 mb-1 block">Mot de passe</label>
                <input type="password" id="pass" class="w-full p-4 bg-slate-800/50 rounded-2xl border border-transparent focus:border-blue-500 outline-none transition-all font-bold text-sm">
            </div>
            
            <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl uppercase text-[11px] tracking-widest shadow-xl shadow-blue-500/20 transition-all">Se connecter</button>
            
            <div class="flex justify-center mt-6">
                <button onclick="forgotPassword()" class="text-[10px] font-black uppercase text-slate-500 hover:text-white transition-colors">Mot de passe oublié ?</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = { /* Ta config ici */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        try {
            await signInWithEmailAndPassword(auth, e, p);
            window.location.href = "Roit.html";
        } catch(err) { alert("Identifiants incorrects."); }
    };

    window.forgotPassword = async () => {
        const e = document.getElementById('email').value;
        if(!e) return alert("Entrez votre email pour recevoir le lien de réinitialisation.");
        try {
            await sendPasswordResetEmail(auth, e);
            alert("Lien envoyé sur votre boîte mail !");
        } catch(err) { alert(err.message); }
    };
</script>
</body>
</html>
