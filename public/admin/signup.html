<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Briefly - Créer un compte</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:system-ui,sans-serif;padding:16px}
.card{background:#fff;padding:32px;border-radius:24px;box-shadow:0 20px 60px -20px rgba(15,23,42,.2);width:100%;max-width:400px;box-sizing:border-box}
h1{margin:0 0 8px;font-size:32px;font-weight:900;font-style:italic}.badge{display:inline-block;padding:5px 12px;background:#eef2ff;color:#4f46e5;font-size:10px;font-weight:800;border-radius:99px;text-transform:uppercase;letter-spacing:.1em}
label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#94a3b8;margin:18px 0 6px;letter-spacing:.1em}
input{width:100%;box-sizing:border-box;padding:14px 18px;border-radius:14px;border:2px solid transparent;background:#f1f5f9;font-size:15px;outline:none}input:focus{border-color:#4f46e5;background:#fff}
button{width:100%;margin-top:24px;padding:16px;border:0;border-radius:14px;background:#0f172a;color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.15em;font-size:12px;cursor:pointer}button:disabled{opacity:.6}
.err{color:#dc2626;font-size:12px;font-weight:700;margin-top:14px;text-align:center}.hide{display:none}.msg{text-align:center;color:#475569;font-size:14px;line-height:1.5}
</style></head>
<body>
<div id="loader" class="msg">Vérification de l'invitation…</div>
<div id="card" class="card hide">
  <h1>Briefly<span style="color:#4f46e5">.</span></h1><span id="role" class="badge"></span>
  <label>Nom complet</label><input id="name" autocomplete="name">
  <label>E-mail</label><input id="email" type="email" autocomplete="email">
  <label>Mot de passe (8 caractères min.)</label><input id="password" type="password" autocomplete="new-password">
  <button id="go">Activer mon accès</button><p id="err" class="err hide"></p>
</div>
<div id="bad" class="card hide msg"><h1>🚫</h1><b>Lien invalide</b><br>Cette invitation est expirée ou déjà utilisée. Contactez l'administrateur.</div>
<div id="ok" class="card hide msg"><h1>✅</h1><b id="ok-t">Compte créé</b><p id="ok-m"></p><p><a href="/admin/">Ouvrir l'application admin</a></p></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const sb = createClient("https://woybcqvekkycduagphef.supabase.co", "sb_publishable_RBZJOywJ7g_lv_alT6xiuA_Y2ryLEBZ", { auth: { persistSession: true, storageKey: 'briefly-admin-auth' } });
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('invite');
const show = id => { ['loader','card','bad','ok'].forEach(x => $(x).classList.toggle('hide', x !== id)); };
const LBL = { admin_general: 'Administrateur général', redacteur: 'Rédacteur' };
(async () => {
  if (!token) return show('bad');
  const { data: role } = await sb.rpc('check_invitation', { p_token: token });
  if (!role) return show('bad');
  $('role').textContent = 'Rôle : ' + (LBL[role] || role); show('card');
})();
$('go').onclick = async () => {
  const name = $('name').value.trim(), email = $('email').value.trim(), password = $('password').value, err = $('err');
  err.classList.add('hide');
  if (!name || !email || password.length < 8) { err.textContent = 'Champs incomplets ou mot de passe trop court.'; err.classList.remove('hide'); return; }
  $('go').disabled = true;
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + '/admin/' } });
  if (error) { err.textContent = error.message; err.classList.remove('hide'); $('go').disabled = false; return; }
  if (data.session) {
    const { error: e2 } = await sb.rpc('claim_invitation', { p_token: token, p_name: name });
    if (e2) { err.textContent = e2.message; err.classList.remove('hide'); $('go').disabled = false; return; }
    $('ok-m').textContent = 'Votre accès est actif.';
  } else {
    try { localStorage.setItem('briefly_invite', token); } catch {}
    $('ok-t').textContent = 'Vérifiez vos e-mails';
    $('ok-m').textContent = 'Cliquez sur le lien de confirmation reçu, puis connectez-vous : votre accès sera activé automatiquement.';
  }
  show('ok');
};
</script></body></html>
